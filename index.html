<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مرکز دانلود</title>
<meta name="description" content="فایل‌ها را انتخاب کن و مستقیم دانلود کن.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#061a1f; --sea:#0b2e36; --mint:#3dffc0; --amber:#ffb347; --violet:#8a7bff;
  --ink:#e6f4f1; --mute:#8fb0ab; --glass:rgba(230,244,241,.06); --edge:rgba(230,244,241,.16);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family:"Vazirmatn",Tahoma,sans-serif; color:var(--ink); background:var(--deep);
  background-image:radial-gradient(60rem 40rem at 15% 10%,rgba(61,255,192,.10),transparent 60%),
                   radial-gradient(50rem 40rem at 90% 70%,rgba(138,123,255,.12),transparent 60%);
  min-height:100vh; overflow-x:hidden; line-height:1.8;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px 80px}

.hero{min-height:82vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-top:40px}
.hero h1{font-weight:800;font-size:clamp(2.3rem,6.2vw,4.4rem);line-height:1.3;max-width:12ch}
.hero p{margin-top:18px;color:var(--mute);font-size:1.1rem;max-width:34ch}
.hero a.go{
  margin-top:28px;display:inline-block;padding:12px 26px;border-radius:12px;font-weight:500;
  color:var(--deep);background:var(--mint);text-decoration:none;transition:transform .2s,box-shadow .2s;
}
.hero a.go:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(61,255,192,.35)}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:26px}
.search{
  flex:1 1 240px;padding:12px 16px;border-radius:14px;border:1px solid var(--edge);
  background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);font:inherit;
}
.search::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--edge);
  padding:8px 18px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--deep);border-color:var(--ink)}
.count{color:var(--mute);font-size:.95rem;margin-inline-start:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;perspective:1000px}
.card{
  --c:var(--mint);--mx:50%;--my:50%;
  position:relative;padding:22px;border-radius:20px;border:1px solid var(--edge);
  background:linear-gradient(160deg,rgba(230,244,241,.09),rgba(230,244,241,.03));
  backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px;
  transform-style:preserve-3d;transition:transform .25s ease-out,border-color .25s,box-shadow .25s;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(260px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 38%,transparent),transparent 70%);
}
.card:hover{border-color:var(--c);box-shadow:0 18px 50px color-mix(in srgb,var(--c) 22%,transparent)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.ext{
  align-self:flex-start;font-size:.8rem;font-weight:500;padding:2px 12px;border-radius:99px;
  border:1px solid var(--c);color:var(--c);direction:ltr;
}
.card h3{font-size:1.2rem;font-weight:800;transform:translateZ(30px)}
.card p{color:var(--mute);font-size:.95rem;flex:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.size{color:var(--mute);font-size:.9rem;direction:ltr}
.dl{
  display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:12px;
  background:var(--c);color:var(--deep);font-weight:500;text-decoration:none;
  transform:translateZ(40px);transition:filter .2s,transform .2s;
}
.dl:hover{filter:brightness(1.12)}
.dl:active{transform:translateZ(40px) scale(.96)}
.dl svg{width:16px;height:16px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0}

a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;z-index:5;
  padding:12px 24px;border-radius:14px;background:var(--ink);color:var(--deep);font-weight:500;
  transition:transform .3s,opacity .3s;pointer-events:none;
}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:700px){
  .hero{min-height:88vh;justify-content:flex-end;padding-bottom:30px}
  .count{margin-inline-start:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<main>
  <section class="hero">
    <h1 id="title">مرکز دانلود فایل‌ها</h1>
    <p id="subtitle">فایل مورد نظرت را انتخاب کن و مستقیم دانلود کن. بدون ثبت‌نام، بدون معطلی.</p>
    <a class="go" href="#files">دیدن فایل‌ها</a>
  </section>

  <section id="files">
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="جستجوی فایل…" aria-label="جستجوی فایل">
      <div class="chips" id="chips" role="group" aria-label="دسته‌بندی"></div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* فایل‌ها و متن‌های سایت از files.json خوانده می‌شوند.
   برای مدیریت آن‌ها از admin.html (روی کامپیوتر خودت) استفاده کن. */
let FILES = [];

/* ---------- لیست و فیلتر ---------- */
const $ = s => document.querySelector(s);
const fa = n => n.toLocaleString("fa-IR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const grid = $("#grid"), chips = $("#chips"), q = $("#q"), count = $("#count"), toast = $("#toast");
let cats = ["همه"];
let cat = "همه";
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>';

const buildChips = () => { chips.innerHTML = cats.length > 2 ? cats.map(c => `<button class="chip" aria-pressed="${c === cat}">${esc(c)}</button>`).join("") : ""; };
chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.textContent;
  chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
q.addEventListener("input", render);

function render(){
  const t = q.value.trim();
  const list = FILES.filter(f => (cat === "همه" || f.cat === cat) && (f.name + f.desc).includes(t));
  count.textContent = fa(list.length) + " فایل";
  grid.innerHTML = list.length ? list.map(f => `
    <article class="card" style="--c:${esc(f.c)}" data-c="${esc(f.c)}">
      <span class="ext">${esc(f.ext)}</span>
      <h3>${esc(f.name)}</h3>
      <p>${esc(f.desc)}</p>
      <div class="foot">
        <span class="size">${esc(f.size)}</span>
        <a class="dl" href="${esc(f.url)}" download>${DL_ICON}دانلود</a>
      </div>
    </article>`).join("") : `<p class="empty">${FILES.length ? "فایلی پیدا نشد. عبارت دیگری را امتحان کن." : "هنوز فایلی اضافه نشده."}</p>`;
}
fetch("files.json", {cache: "no-store"})
  .then(r => r.json())
  .then(d => {
    FILES = d.files || [];
    if (d.title) { $("#title").textContent = d.title; document.title = d.title; }
    if (d.subtitle) $("#subtitle").textContent = d.subtitle;
    cats = ["همه", ...new Set(FILES.map(f => f.cat).filter(Boolean))];
    buildChips(); render();
  })
  .catch(() => { grid.innerHTML = '<p class="empty">فایل files.json پیدا نشد. سایت را از گیت‌هاب یا با یک سرور محلی باز کن.</p>'; });

/* ---------- کارت‌های سه‌بعدی ---------- */
grid.addEventListener("pointermove", e => {
  const card = e.target.closest(".card"); if (!card || e.pointerType !== "mouse" || calm) return;
  const r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  card.style.transform = `rotateY(${(px - .5) * 14}deg) rotateX(${(.5 - py) * 14}deg)`;
  card.style.setProperty("--mx", px * 100 + "%"); card.style.setProperty("--my", py * 100 + "%");
});
grid.addEventListener("pointerover", e => { const c = e.target.closest(".card"); if (c) setColor(c.dataset.c); });
grid.addEventListener("pointerout", e => {
  const c = e.target.closest(".card"); if (!c) return;
  if (!c.contains(e.relatedTarget)) { c.style.transform = ""; setColor("#3dffc0"); }
});
grid.addEventListener("focusin", e => { const c = e.target.closest(".card"); if (c) setColor(c.dataset.c); });
grid.addEventListener("click", e => {
  const a = e.target.closest(".dl"); if (!a) return;
  burst = 1;
  toast.textContent = "دانلود شروع شد";
  toast.classList.add("show"); clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove("show"), 2200);
});

/* ---------- صحنه سه‌بعدی ---------- */
let burst = 0, setColor = () => {};
if (window.THREE) {
  const T = THREE, cv = $("#bg");
  const renderer = new T.WebGLRenderer({canvas: cv, antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new T.Scene(), camera = new T.PerspectiveCamera(50, 1, .1, 100);
  camera.position.z = 8;

  const col = new T.Color("#3dffc0"), goal = new T.Color("#3dffc0");
  const mat = (o = {}) => new T.MeshBasicMaterial(Object.assign({color: col.clone(), transparent: true}, o));

  const group = new T.Group();
  const core = new T.Mesh(new T.IcosahedronGeometry(1.6, 1), mat({wireframe: true, opacity: .85}));
  const heart = new T.Mesh(new T.OctahedronGeometry(.85), mat({opacity: .28}));
  const ring = new T.Mesh(new T.TorusGeometry(2.6, .014, 8, 160), mat({opacity: .7}));
  const ring2 = new T.Mesh(new T.TorusGeometry(3.1, .01, 8, 160), mat({opacity: .35}));
  ring.rotation.x = 1.2; ring2.rotation.y = 1.1;
  group.add(core, heart, ring, ring2);
  scene.add(group);

  const N = 1400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 3.5 + Math.random() * 14, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(b) * Math.cos(a), r * Math.sin(b) * Math.sin(a), r * Math.cos(b)], i * 3);
  }
  const pg = new T.BufferGeometry(); pg.setAttribute("position", new T.BufferAttribute(pos, 3));
  const pts = new T.Points(pg, new T.PointsMaterial({color: col.clone(), size: .035, transparent: true, opacity: .8}));
  scene.add(pts);

  setColor = hex => goal.set(hex);

  let W, H, baseX = 0, baseY = 0, scale = 1;
  const fit = () => {
    W = innerWidth; H = innerHeight;
    renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
    const wide = W > 900;
    baseX = wide ? -3.2 : 0; baseY = wide ? 0 : 2.1; scale = wide ? 1 : .7;
  };
  addEventListener("resize", fit); fit();

  let mx = 0, my = 0, sx = 0, sy = 0;
  addEventListener("pointermove", e => { mx = e.clientX / W - .5; my = e.clientY / H - .5; });

  const spin = calm ? .25 : 1;
  (function loop(){
    requestAnimationFrame(loop);
    sx += (mx - sx) * .05; sy += (my - sy) * .05;
    col.lerp(goal, .07);
    [core, heart, ring, ring2, pts].forEach(m => m.material.color.copy(col));

    const s = scale * (1 + burst * .4);
    group.scale.setScalar(s);
    group.position.set(baseX, baseY + scrollY * .004, 0);
    group.rotation.y += (.004 + burst * .12) * spin;
    group.rotation.x = sy * .8;
    group.rotation.z = -sx * .4;
    heart.rotation.y -= .012 * spin; heart.rotation.x += .008 * spin;
    ring.rotation.z += .006 * spin; ring2.rotation.x -= .004 * spin;
    pts.rotation.y += .0006 * spin;
    pts.material.size = .035 + burst * .09;
    camera.position.x = sx * 1.2; camera.position.y = -sy * .8; camera.lookAt(0, 0, 0);
    burst *= .93;
    renderer.render(scene, camera);
  })();
}
</script>
</body>
</html>
